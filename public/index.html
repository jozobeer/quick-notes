<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クイックメモ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='2' fill='%232a2f38' stroke='%237a8a9a' stroke-width='1.5'/%3E%3Cpath d='M10 9h12M10 14h12M10 19h8' stroke='%239ab0c4' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M20 22l5-5 2.5 2.5-5 5H20v-2.5z' fill='%23c9a66b' stroke='%23a8844a' stroke-width='.8'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #1a1d23;
      --bg-panel: #22262e;
      --text: #e6e8ec;
      --muted: #8b93a1;
      --accent: #c9a66b;
      --border: #323843;
      --danger: #c97a6b;
      --font: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      background:
        radial-gradient(ellipse at top, #252a34 0%, transparent 55%),
        linear-gradient(160deg, #171a20 0%, #1a1d23 50%, #14171c 100%);
      color: var(--text);
      font-family: var(--font);
    }

    .app {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      max-width: 56rem;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1rem 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #status {
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #status.visible {
      opacity: 1;
    }

    #clear {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
    }

    #clear:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    #note {
      flex: 1;
      width: 100%;
      min-height: 16rem;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-panel);
      color: var(--text);
      font: inherit;
      font-size: 1.05rem;
      line-height: 1.65;
      padding: 1rem 1.1rem;
      outline: none;
    }

    #note:focus {
      border-color: #4a5568;
      box-shadow: 0 0 0 1px #4a5568;
    }

    #note::placeholder {
      color: #5c6573;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.6;
      flex-shrink: 0;
      padding-bottom: 1rem;
    }

    footer a {
      color: inherit;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>クイックメモ</h1>
      <div class="actions">
        <span id="status" aria-live="polite"></span>
        <button type="button" id="clear">全消去</button>
      </div>
    </header>
    <textarea id="note" placeholder="思いついたことをそのまま書く…" aria-label="メモ"></textarea>
  </div>
  <footer>
    <a href="https://apps.jozo.beer">apps.jozo.beer</a>
  </footer>
  <script>
    (function () {
      var STORAGE_KEY = "quick-notes:content";
      var note = document.getElementById("note");
      var clearBtn = document.getElementById("clear");
      var statusEl = document.getElementById("status");
      var storageOk = true;
      var statusTimer = null;

      function showSaved() {
        if (!storageOk) return;
        statusEl.textContent = "保存済み";
        statusEl.classList.add("visible");
        if (statusTimer) clearTimeout(statusTimer);
        statusTimer = setTimeout(function () {
          statusEl.classList.remove("visible");
        }, 1200);
      }

      function saveNote() {
        try {
          localStorage.setItem(STORAGE_KEY, note.value);
          showSaved();
        } catch (e) {
          storageOk = false;
          statusEl.textContent = "";
          statusEl.classList.remove("visible");
        }
      }

      function restoreNote() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (saved !== null) note.value = saved;
        } catch (e) {
          storageOk = false;
        }
        note.focus();
      }

      function clearNote() {
        note.value = "";
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
          storageOk = false;
        }
        if (storageOk) {
          statusEl.textContent = "消去済み";
          statusEl.classList.add("visible");
          if (statusTimer) clearTimeout(statusTimer);
          statusTimer = setTimeout(function () {
            statusEl.classList.remove("visible");
          }, 1200);
        }
        note.focus();
      }

      note.addEventListener("input", saveNote);
      clearBtn.addEventListener("click", clearNote);

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", restoreNote);
      } else {
        restoreNote();
      }
    })();
  </script>
</body>
</html>
